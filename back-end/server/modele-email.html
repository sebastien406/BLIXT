<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sansation; line-height: 1.6; color: #000000; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #00e0ff;font-size: x-large; color: rgb(0, 0, 0); padding: 20px; text-align: center; border-radius: 15px 15px 0 0; }
        .content { background-color: #000000; padding: 30px; border-radius: 0 0 15px 15px; }
        .field { margin-bottom: 20px; padding: 15px; background: white; border-left: 8px solid  #00e0ff;border-radius: 15px; }
        .label { font-weight: bold;font-size: x-large; color: #000000; display: block; margin-bottom: 5px; }
        .value { color: #333;font-weight: bold }
        .message-box { background-color: #fff;font-weight: bold; padding: 15px; border: 1px solid #ddd; border-radius: 15px; margin-top: 10px; }
        .footer { text-align: center; margin-top: 20px; color: #00e0ff; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>⚡ Nouvelle demande de devis BLIXT</h2>
        </div>
        <div class="content">
            <div class="field">
                <span class="label">👤 Nom complet</span>
                <span class="value">__NAME__</span>
            </div>
            <div class="field">
                <span class="label">📧 Email</span>
                <span class="value"><a href="mailto:__EMAIL__">__EMAIL__</a></span>
            </div>
            <div class="field">
                <span class="label">📱 Téléphone</span>
                <span class="value">__PHONE__</span>
            </div>
            <div class="field">
                <span class="label">💬 Message</span>
                <div class="message-box">
                    __MESSAGE__
                </div>
            </div>
            <div class="footer">
                📅 Reçu le __DATE__
            </div>
        </div>
    </div>
</body>
</html>
