<!--
  Ceci est un exemple minimal des éléments reCAPTCHA nécessaires.
  Assurez-vous que votre fichier contact.html contient ces deux parties.
-->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Blixt</title>
    
    <!-- NOUVELLE RÈGLE : Ajout du Content Security Policy (CSP) -->
    <!-- Ceci autorise explicitement le navigateur à charger les scripts et styles de Google reCAPTCHA. -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; frame-src https://www.google.com;">
    
    <!-- 1. INTÉGRATION CÔTÉ CLIENT : Script de l'API reCAPTCHA -->
    <!-- Il doit être dans le <head> ou juste avant </body> -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Styles de base (ajustez-les pour correspondre à votre design néon) -->
    <style>
        body {
            background-color: #000;
            color: #00ffff;
            font-family: Arial, sans-serif;
            padding: 50px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            border: 2px solid #00ffff;
            box-shadow: 0 0 10px #00ffff;
            padding: 30px;
        }
        form > div {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #00ffff;
            background-color: #111;
            color: #fff;
        }
        button {
            background-color: #00ffff;
            color: #000;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        /* Style pour centrer le reCAPTCHA si besoin */
        .recaptcha-wrapper {
            display: flex;
            justify-content: flex-start; /* Aligné à gauche par défaut */
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Envoyez-nous un message</h1>
    <form action="VOTRE_ENDPOINT_DE_SERVEUR" method="POST">
        <!-- Champ NOM -->
        <div>
            <label for="nom">Votre nom:</label>
            <input type="text" id="nom" name="nom" required>
        </div>

        <!-- Champ EMAIL -->
        <div>
            <label for="email">Votre e-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <!-- Champ MESSAGE -->
        <div>
            <label for="message">Votre message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <!-- 2. INTÉGRATION CÔTÉ CLIENT : Le DIV du reCAPTCHA -->
        <!-- La Clé du Site doit être ici : 6LcrlPMrAAAAACwIB_8xcY3tsW8pYPCYLLrA7h -->
        <div class="recaptcha-wrapper">
             <div class="g-recaptcha" data-sitekey="6LcrlPMrAAAAACwIB_8xcY3tsW8pYPCYLLrA7h"></div>
        </div>
        
        <!-- Bouton d'envoi -->
        <button type="submit">Envoyer votre message</button>
    </form>
</div>

</body>
</html>
